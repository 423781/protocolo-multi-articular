button:not(:disabled):not([data-flat]) { box-shadow: 0 4px 0 rgba(3,8,22,.75), 0 9px 16px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.18), inset 0 -2px 0 rgba(0,0,0,.28); }

  background-image: linear-gradient(180deg, rgba(255,255,255,.085) 0%, rgba(255,255,255,.015) 38%, rgba(0,0,0,.20) 100%) !important;

input[type="range"] { accent-color: #d9ab3f; }

  border-bottom: 8px solid #6c470c; box-shadow: 0 14px 24px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.75), inset 0 -3px 0 rgba(110,70,8,.4), inset 2px 0 0 rgba(255,255,255,.25), inset -2px 0 0 rgba(110,70,8,.25); text-shadow: 0 1px 0 rgba(255,255,255,.45); }
.gbtn:not(:disabled):active { transform: translateY(6px); border-bottom-width: 2px; margin-bottom: 6px; box-shadow: 0 2px 6px rgba(0,0,0,.55), 0 0 30px rgba(244,220,148,.8), inset 0 4px 10px rgba(90,55,4,.55); animation: gLit .5s ease-out; filter: brightness(1.08); }

[style*="linear-gradient(135deg, var(--accent), var(--accent2))"], button[style*="background: var(--accent)"] { color: #2a1a04 !important; text-shadow: none; }

.cmp-rail button[data-on="1"] { background: linear-gradient(180deg,#fff1b5,#d9ab3f 60%,#b8861f); color: #2a1a04; border-color: transparent; }

}

.gold-rule::after { content: ""; position: absolute; left: 50%; top: -4px; width: 7px; height: 7px; background: #f4dc94; transform: translateX(-50%) rotate(45deg); box-shadow: 0 0 8px rgba(244,220,148,.85); }

terial is used where, only its surface conviction."},{id:"ultraplus",label:"Ultra+",sub:"desgaste natural (opcional)",en:"Apply a MAXIMUM texture-fidelity pass AND unlock natural environmental richness. This explicitly overrides any general 'keep every surface clean/commercially presentable' or 'never toward damaged, dirty or rough surfaces' language found elsewhere in this prompt \u2014 for THIS generation, richer, more photographic surface behavior is wanted. Specifically: (1) allow strong, directional/raking light that visibly models real surface relief \u2014 light and shadow reading as physical depth between slats, grooves, ribs and panel joints, not flat even shading; (2) render full material tactility with real specular response \u2014 fabric weave catching light, leather grain and creases, satin/brushed metal micro-reflection, wood pore; (3) where the base image's own materials and setting already make it physically plausible (e.g. an outdoor wooden boat, an exposed stone base, bare soil near water), allow natural environmental wear consistent with that setting \u2014 fallen leaves and organic debris on the ground, uneven or damp soil, moss or patina on stone, weathered or flaking paint on old exposed wood. Do NOT invent weathering on elements where it is not plausible (a new indoor chair, a fresh wall panel, commercial furniture stay clean). HARD EXCEPTION \u2014 THIS NEVER OVERRIDES: IDENTITY & COLOR LOCK and COLOR VALUE LOCK remain absolute even with this tier active \u2014 every object's exact color, exact material family, count and position from the base stay completely fixed. This tier only changes how convincingly light and surface texture read; it NEVER changes what an object is made of or what color it is (e.g. a black polypropylene chair must stay black polypropylene, never drift to grey leather; grey rough-cut rubble stone must stay grey rough-cut rubble stone, never drift to beige coursed ashlar; autumn-gold foliage must stay autumn-gold, never d 9u / horizonte",en:"an open sky with a soft, natural horizon"}],jy=[{id:"ground",label:"T\xE9rreo / n\xEDvel rua",en:"VIEWPOINT HEIGHT \u2014 GROUND FLOOR: the camera is at standing eye level on the ground. Vegetation outside is seen from the ground: trunks, shrub bases, planting beds and whole trees are visible and correctly scaled to a standing person."},{id:"mid",label:"Andar m\xE9dio (~5\xBA)",en:"VIEWPOINT HEIGHT \u2014 MID-RISE (about the 5th floor): the camera looks out from a mid-level floor, ABOVE the street tree canopy. Outside, show building facades across the street, a band of sky, and the TOPS (canopies) of street trees seen from above and below the horizon line, scattered irregularly between the blocks. Street trees reach at most the height of a third floor. NEVER show a tree trunk, a tree base or a tree rising above the surrounding buildings, and never place a tree in the foreground of the view."},{id:"rooftop",label:"Rooftop / \xFAltimo andar",en:"VIEWPOINT HEIGHT \u2014 ROOFTOP: the camera looks out from the top of the building. Show a wide city view with a readable skyline, generous open sky, rooftops below, and tree canopies far below as irregular patches of green between the blocks. NEVER show a tree trunk, a whole tree in the foreground, or any tree taller than the surrounding buildings."}],Lx="OUTSIDE VIEW AT NIGHT/DUSK \u2014 RANDOMIZED CITY LIGHTS (mandatory whenever the scene's atmosphere is night, dusk or late afternoon): the city visible outside must read as a real lit city, never as a uniformly lit one. Light only SOME of the windows of each building and each house, in an irregular, non-repeating, believable pattern \u2014 many windows stay completely dark; mix warm and cool interior tones between units; buildings further away carry fewer and dimmer lit windows. Add street lighting from the poles, car headlights and tail lights on the road, and lit shopfronts along the sidewalk where a sidewalk is visible. At dusk, part of the lights are already on while the sky is still luminous. Keep every light small, crisp and correctly exposed \u2014 no bloom, no halo, no blown-out white.",Hx="BACKGROUND EFFORT (user asked for a reinforced surrounding): treat everything visible through the glass as a fully resolved part of the image, not a backdrop \u2014 correct depth and atmospheric perspective, readable materials on the nearest buildings, irregular, natural-looking vegetation, and a sky with real gradient and cloud structure. The outside view must never be flat, empty, washed out or blown to white.",Od=[{id:"spots",label:"Spots direcionais",sub:"spots de trilho ou soltos abaixo do forro",en:"directional spotlights (track-mounted or surface-mounted below the ceiling) casting defined, controlled accent pools of light"},{id:"recessed",label:"Lumin\xE1rias de forro embutidas",en:"recessed ceiling luminaires flush-integrated into the ceiling plane, matching exactly the fixtures already visible in the base"},{id:"linear",label:"LED linear",en:"linear LED profiles/strips with an even, continuous glow \u2014 defined but never blown to pure white"},{id:"sconce",label:"Arandela de parede",en:"wall sconces washing the wall with a soft, controlled gradient"},{id:"pendant",label:"Pendente / lustre",en:"pendant lights or a chandelier acting as the decorative focal light of the room"},{id:"tablelamp",label:"Abajur",en:"a table/floor lamp (abajur) with its own shade, acting as a warm, localized accent light source on furniture such as a side table or console"},{id:"hidden",label:"Luz oculta",sub:"sancas, luzes indiretas",en:"hidden cove lighting (sanca) emitting indirect light that washes the adjacent wall or ceiling with a smooth continuous gradient, keeping the emitter itself completely concealed"},{id:"other",label:"Outros",sub:"descreva a lumin\xE1ria",en:"an additional light fixture described by the user below",free:!0}],qy="HIDDEN COVE LIGHT \u2014 YELLOW MARKING KEY (mandatory): any yellow line, dashed yellow stroke or yellow highlight drawn over the base image is an ANNOTATION, never geometry \u2014 never render the yellow line itself and never treat it as an object, trim or material. It marks the exact position where hidden/indirect cove lighting (sanca) must be emitted. Emit the indirect light strictly along those marked positions, washing the adjacent wall or ceiling with a soft continuous gradient while keeping the light source concealed. Do NOT create cove/indirect lighting anywhere that is not marked in yellow.",Yy=[{id:"randomized",label:"Luzes internas randomizadas",sub:"n\xE3o acende tudo \u2014 realismo",en:"interior lights of the building randomized realistically: some rooms/units clearly lit and others completely dark, in an irregular, believable, non-repeating pattern. NEVER light every window at once"},{id:"allon",label:"Luzes internas acesas gerais",en:"all interior lights of the building turned on, evenly and consistently"},{id:"landscape",label:"Luzes de paisagismo",en:"landscape lighting: discreet ground-level uplights on the planting and low path lights along the walkways"},{id:"pool",label:"Luzes de piscina",en:"underwater pool lighting glowing softly through the water"},{id:"urban",label:"Ilumina\xE7\xE3o urbana",sub:"postes de rua",en:"urban street lighting from the street poles along the road"}],Ux=`PHOTOREALISTIC VEGETATION: render every plant and all foliage as real, photographed botany \u2014 never a 3D-library asset or an illustrated/CGI look. Natural per-leaf variation in size, angle and shade of green; occasional dry, yellowed or lightly browned leaf tips and edges; visible leaf veins and subtle surface imperfections; a matte, non-plastic surface with only soft micro-highlights (no glossy synthetic sheen); real depth and self-shadowing between overlapping layers of leaves; slight translucency where light passes through the thinnest leaves; and a gentle depth-of-field softening on the foreground plants closest to the camera so they read as a genuine photograph.
NO REPEATED/GEOMETRIC FOLIAGE (critical, most common vegetation failure on this pipeline): never render foliage as repeated, "stamped" leaf clusters of near-identical shape and size, and never let branches read as straight, uniformly-tapering or geometrically regular. Real trees are irregular: vary cluster size, density and silhouette noticeably across the same tree and between trees; let some branches curve, fork at uneven angles and overlap unevenly; leave natural gaps and negative space within the canopy instead of a solid, uniform mass. If you notice yourself about to repeat the same leaf-cluster shape more than twice in a row, vary it before continuing. Background/distant trees still need this same irregularity, just at lower individual-leaf detail \u2014 a distant tree is a less-detailed real tree, never a flat green silhouette.`,Xy=`PORTFOLIO STYLE PASS \u2014 a DELIBERATELY BOLD cinematic photographic treatment layered on top of the exact same composition already generated, in the style of high-end architectural photography award submissions (think: a striking editorial spread, not a brochure render). This is a lighting/atmosphere/post-production treatment only, NOT a new scene \u2014 but it must be UNMISTAKABLY, IMMEDIATELY different from the base image at a glance, not a subtle brightness tweak.

CALIBRATION CHECK (read this first): imagine placing the base image and your output side by side, at thumbnail size, from across a room. If a viewer at that distance could mistake one for a slightly-brighter export of the other, you have UNDER-DELIVERED this pass and must push every effect below harder. The single most common failure of this pass is timidity \u2014 producing an image that is 90% identical to the base with only a faint wash of light added. Treat that outcome as a hard failure, not an acceptable safe result. This must look like a different photographer, with different gear and a lighting rig, shot a second photograph of the same real space \u2014 not like someone raised the brightness slider on the first photograph.

HARD FIDELITY LOCK: keep the exact same camera angle, framing, layout, architecture, furniture placement and scale, materials and colors as the base image. Do not add, remove, move or resize any element. Do not change the time-of-day, climate or light sources already defined elsewhere in this prompt \u2014 this pass only changes how that same light and atmosphere is photographed, never what it is. Fidelity to layout/geometry/materials is absolute \u2014 but the LIGHT, ATMOSPHERE and PHOTOGRAPHIC TREATMENT must shift dramatically, not just brighten.

Apply ALL FIVE of the following, each pushed to a strength that is UNMISSABLE at a glance, not merely detectable on close inspection \u2014 this must NOT read as "the same image, a bit brighter":
- STRONG BACKLIGHT / CONTRE-JOUR (dominant, unmissable): take whichever light source is already dominant and push it hard into a dramatic backlight/rim-light \u2014 strong directional glow, a visibly glowing light source with real bloom spilling across nearby edges and surfaces, and strong contrast between the light source itself and its immediate surroundings. This is the single most important effect of this pass \u2014 if a viewer cannot immediately point at the light source and say "that's clearly backlit", this effect was under-applied and must be pushed further. Even so, every material and surface in the frame \u2014 walls, floors, furniture, finishes \u2014 must stay clearly legible and true to its base tone: this is bright, airy, art-directed contre-jour light, never a globally dim or underexposed image, and never blanket silhouette-darkening across large areas of the scene.
- CONTROLLED FLOOR REFLECTIONS (unmissable, mirror-like where the floor allows it): render bold, sharp, clearly-legible reflections of the main light sources and key elements on any polished, wet or glossy floor already present \u2014 strong enough that a viewer notices the reflections before anything else on the floor, not a faint sheen you have to look for. Never turn a matte floor glossy.
- ATMOSPHERIC HAZE (thick enough to visibly layer the space): a strongly visible atmospheric haze/fog layer in the air \u2014 enough to clearly separate foreground, midground and background into distinct visual layers, let backlight visibly scatter and bloom through it in beams or glow, and give the whole frame real cinematic depth at first glance, before any other detail registers.
- PHOTOGRAPHIC GRAIN & MICRO-DETAIL (real film-like texture, strongly present): pronounced, unmistakable photographic sensor grain and imperfections across the whole frame, strong enough to be visible even at normal viewing size, not only on a zoomed crop \u2014 enough to completely kill any "clean 3D render" look and read unmistakably as a shot photograph.
- SHALLOW DEPTH-OF-FIELD BLUR (clearly photographic, editorial-lens strength): a strong, unmistakably photographic falloff of sharpness toward the extreme foreground and background \u2014 closer to a fast prime lens at a wide aperture than a generic render's subtle depth cue \u2014 while the main subject plane stays crisp.

If, after applying all five, the result would still look like a safe, close variant of the base image rather than a second, dramatically different photograph of the same space, push every effect further still \u2014 under-delivering this pass is a worse outcome than over-delivering it.

Overall exposure should shift toward a bright, art-directed, editorial-magazine grade \u2014 think a premium architecture/design publication or a curated Midjourney-style portfolio shot: luminous, warm highlights, clean and inviting, with the backlight and haze doing the dramatic work \u2014 rather than a dark or heavily shadowed grade. A flat "just lighter, nothing else changed" result is a FAILURE of this pass, but so is an image where materials and textures read as dim or muddy. The result must still read as the same project, same design, same materials, with every finish clearly visible and true to its color \u2014 but photographed and post-produced like an award-grade portfolio photograph, dramatically distinct from the clean base render, never a near-identical, slightly brighter copy of it, and never a darkened one.`,fs=[{id:"eye",label:"Observador",sub:"1,70 m",en:{interior:"EYE-LEVEL HARD LOCK: the camera lens is at exactly 1.70 m above the FLOOR, standing on the floor of this room, with a perfectly HORIZONTAL line of sight (zero tilt up or down). The horizon line sits at 1.70 m on every wall: doors, windows and furniture tops are read from a standing person's eyes; the tops of tables and counters are seen only slightly from above; the ceiling is visible and plays a real role in the frame. All verticals perfectly vertical and parallel (2-point perspective).",facade:"EYE-LEVEL HARD LOCK: the camera lens is at exactly 1.70 m above the GROUND, a person standing on the ground/sidewalk in front of the building, with a perfectly HORIZONTAL line of sight (zero tilt). The horizon line sits at 1.70 m, roughly at the height of a person's eyes on the ground floor: the ROOF IS NOT VISIBLE (only the underside of eaves, slabs and overhangs can be seen), upper floors are seen from below, the ground plane is strongly foreshortened, and anything behind walls, fences or vegetation at ground level is hidden. All verticals perfectly vertical and parallel (2-point perspective)."}},{id:"mid",label:"Meia altura",sub:"drone baixo",en:{interior:"Camera raised high in a corner of the room (~2.4 m, just below the ceiling), looking slightly down at ~20\u201330\xB0, showing more of the floor and the furniture layout. Keep verticals as straight as possible.",facade:"Camera on a low drone (~6\u201310 m above the ground), looking slightly down at ~20\u201330\xB0, showing the building together with its immediate ground plane, landscaping and entrance."}},{id:"aerial",label:"A\xE9rea",sub:"vista de cima",en:{interior:"Highest possible viewpoint inside the room (upper corner, right below the ceiling) looking down at ~45\xB0, with a wider lens, revealing the whole room layout at once. Never remove the ceiling or render a cutaway.",facade:"High aerial drone view (~30\u201340 m) looking down at ~45\u201360\xB0, showing the whole building, its roof, the full lot and the surrounding context (3-point perspective allowed)."}}],_x="CAMERA HEIGHT CHANGE (mandatory): the source image may have been taken from a very different height (e.g. an aerial or drone view). IGNORE the source camera height completely \u2014 the source only tells you WHAT exists and WHERE. Rebuild the view physically from the requested height. If the requested height is eye level, the camera is ON THE GROUND at 1.70 m: a result that still shows the roof, the whole lot from above, or the floor plan layout from above is WRONG and must not be returned.",Bx=`NEW CAMERA ANGLE PASS \u2014 the attached image is a finished photograph of a real, fixed, already-built project. Re-photograph THAT SAME PROJECT from a new camera position, as a professional architectural photographer who physically walked to another spot with the same camera.

STEP 1 \u2014 BUILD THE SPACE IN YOUR HEAD FIRST: before drawing anything, reconstruct the project as a 3D space from the source image: the footprint, walls, openings, floor levels, walkways, stairs, furniture, plants and where each one sits relative to the others. Only then place the new camera inside that 3D space.

STEP 2 \u2014 PHYSICALLY CORRECT VISIBILITY (critical): what appears in the new image is decided ONLY by what the new camera can actually see from its new position and direction.
- Anything BEHIND the new camera, outside its field of view, or hidden behind another element from the new position MUST NOT appear \u2014 even if it was prominent in the source (e.g. if the camera now looks back from the far end of a walkway, the part of the walkway the camera is standing on is under/behind it and does not appear in front of the lens; a reverse angle shows the opposite side of the space).
- Never carry the source image's foreground elements into the new foreground out of habit. Never add objects between the camera and the subject that are not physically there.
- Occlusion, overlap and relative scale must follow the real 3D distances from the new camera.

STEP 2B \u2014 DEPTH ORDER LOCK (critical, most common failure \u2014 check this before finishing): every object keeps its real position in 3D space; only the camera moves around that fixed layout. From the new camera position, recompute which objects are nearer and which are farther using their actual coordinates in the reconstructed space from STEP 1 \u2014 never guess or default to the ordering that looked right in the source. It is common to wrongly swap which element reads as foreground and which reads as background when the camera direction changes (e.g. an element that was nearer the original camera ends up misread as farther away, or vice-versa, because its silhouette changed) \u2014 verify each element's distance from the NEW camera explicitly before placing it. Do not invent, duplicate or relocate any object, fixture, material or piece of furniture that is not present in the source at that spot; if uncertain whether something is there, leave it out rather than guessing.

STEP 3 \u2014 WHAT IS LOCKED: architecture, openings, materials, finishes, colors, furniture, decor, plants, their count, sizes and positions relative to each other, every light source and its color temperature, time of day, weather and atmosphere. ONLY THE CAMERA MOVES. Furniture keeps real-world scale relative to doors, ceiling height and people.

STEP 4 \u2014 AREAS THE SOURCE NEVER SHOWED: when the new view reveals parts of the project that are not visible in the source, complete them in coherence with the project's design concept \u2014 the same architectural language, materials, palette, detailing and landscaping style continue naturally. Keep these completions discreet and plausible; never introduce a feature that contradicts what is visible, and never duplicate a visible element to fill space.

OUTPUT: same aspect ratio, same photographic quality, color grading and white balance as the source (no red/magenta drift). It must be unmistakably the same project, seen from a genuinely different, physically consistent camera position.`,Gx=`DETAIL MODE \u2014 a close-up architectural DETAIL photograph taken INSIDE the same scene as the attached full image, in the style of high-end architectural detail photography (material junctions photographed for a portfolio).

IMAGES: the FIRST attached image is the full scene \u2014 the absolute source of truth for materials, colors, lighting and context. The SECOND attached image is a crop of the exact area chosen by the architect \u2014 this is the FOCUS TARGET: move the camera close to exactly that spot. Never photograph any other area of the scene.

FRAMING: the subject is the junction of materials at the target spot (e.g. wood meeting metal, stone meeting timber, cladding meeting glass, plants meeting a base), placed off-center following the rule of thirds and filling roughly 40\u201360% of the frame. Choose the camera height that best reveals that junction (near floor level for a base or baseboard, looking down for a floor detail, looking up for a facade corner).

LENS & FOCUS: 85\u2013100mm lens look with slight compression; shallow depth of field (f/2\u2013f/2.8): a razor-sharp focus plane exactly on the junction, and a creamy bokeh background that still reads as the original scene around it (same walls, plants, furniture, facade, just defocused).

LIGHT: grazing side light that reveals micro-texture \u2014 wood grain and fibers, stone pores and fissures, concrete aggregate, brushed or satin metal edges, fabric weave. Respect the scene's time of day, weather and light sources exactly (if it is raining, surfaces show rain; if it is golden hour, the light is warm and low).

MATERIAL FIDELITY (critical): same materials, colors and finishes as the source. Add plausible, photographic micro-detail consistent with each material, but NEVER add trims, profiles, baseboards, fixtures, hardware, plants or decor that do not exist in the source image. Detail means looking closer, never redesigning.

DEPTH ORDER LOCK (critical, most common failure \u2014 check this before finishing): moving the camera closer does NOT change which real object is nearer or farther in the scene \u2014 only the framing and depth of field change. Identify, from the full scene image, exactly which objects sit in front of the target junction and which sit behind it, and keep that same front/behind relationship in the close-up: an object that was in front of the target (e.g. a table between the camera and a counter) must still read as in front, never pushed behind it, and an object that was behind must not be pulled forward past the target. Do not invent, duplicate or relocate any object, fixture, material or piece of furniture that is not present in the source at that spot; if uncertain whether something is there, leave it out rather than guessing.

NO NEW GEOMETRY (critical, dedicated rule): only elements already visible in the source image may appear inside the detail crop. Do not add walls, panels, columns, trims, mouldings, extra furniture legs or any other object not present in the original composition at that exact spot \u2014 even if it would look plausible, structurally sensible or "complete" there. If the target area shows open space, a plain surface or a simple junction with nothing else around it, keep it exactly that plain; getting physically closer with the camera never adds objects, structure or detail that was not already there in the source.

CLEAR LINE OF SIGHT: nothing stands between the camera and the detail unless it physically exists there in the source image, in its correct real position. Never add foreground leaves, objects, frames or blurred props in front of the subject to create depth \u2014 depth comes only from the shallow focus on the real surroundings behind and beside it.

LOOK: real photograph, not CGI \u2014 natural, non-oversaturated color, real sensor grain, no red/magenta cast, same white balance as the source.`,zd=[{id:"low",label:"Baixo",sub:"toque fotogr\xE1fico sutil",en:"Apply a LIGHT photographic realism pass: subtle natural sensor grain, very gentle micro-imperfections and a slightly more natural (less CG-clean) light falloff. Do NOT increase material bump, roughness or surface relief \u2014 materials stay exactly as clean and true to their base as before."},{id:"medium",label:"M\xE9dio",sub:"equil\xEDbrio foto vs. render",en:"Apply a MODERATE photographic realism pass: natural sensor grain, believable micro-imperfections, and a gentle, physically-plausible increase in material tactility (fabric weave, wood grain, stone texture) \u2014 enough to read as a real photograph rather than a clean render, but never exaggerated. Keep every surface commercially presentable; no heavy bump, no rough or damaged-looking finishes."},{id:"high",label:"Alto",sub:"textura f\xEDsica pronunciada",en:"Apply a STRONG photographic realism pass: pronounced but physically accurate material tactility (visible fabric weave, deep wood grain, real stone micro-relief), true sensor grain and natural imperfections throughout, minimizing any 'clean CGI' look. Still keep every material believable and commercially presentable \u2014 increase physical texture prominence, never turn surfaces rough, damaged or unrealistically bumpy."},{id:"ultra",label:"Ultra",sub:"m\xE1ximo \u2014 cara de fotografia real",en:"Apply a MAXIMUM photographic realism pass: this must read as an actual photograph, not a render, at first glance. Strong, true sensor grain and camera-like imperfections across the entire frame; pronounced, physically accurate material tactility pushed to its most convincing (deep fabric weave, pronounced wood grain, real stone micro-relief and subtle surface irregularity); natural, slightly imperfect real-world light falloff and micro-contrast instead of the smooth, even gradients typical of CGI; subtle lens characteristics (very slight natural vignetting, faint chromatic fringing only at extreme high-contrast edges) as a real camera would produce. The goal is to eliminate every remaining 'clean CGI' tell. Materials must still stay believable, commercially presentable and true to their base identity \u2014 this pushes photographic authenticity to its maximum, never toward damaged, dirty or exaggeratedly rough surfaces."},,{id:"ultraplus",label:"Ultra+",sub:"desgaste natural \xB7 riqueza ambiental",en:"Apply the MAXIMUM photographic realism pass described for Ultra, and ON TOP of it allow contextual environmental richness: gentle natural wear where it would plausibly exist (soft patina on metal, slight unevenness of old paint, faint weathering at the base of exterior walls, moss between outdoor stones, fallen leaves on outdoor ground), stronger directional light with genuine shadow relief, and visible atmospheric depth (light haze in the distance, dust or moisture in a sunbeam). HARD EXCEPTION, never overridden by this tier: the identity, exact colour, exact material, finish, count, size and position of every object stay exactly as in the base image and as specified elsewhere in this prompt. Wear and richness are surface and light qualities only \u2014 they must never make a surface read as damaged, dirty, broken or neglected, and never change what an object IS."}],Vy="FOREGROUND DEPTH OF FIELD (subtle, camera-like): only the immediate foreground closest to the lens falls slightly out of focus, while the main subject plane and every key material stay perfectly sharp. Keep it gentle and photographic \u2014 never soften the primary subject or the materials the client needs to read.",Ky=[{id:"pink",label:"Pink",hex:"#ec4899"},{id:"orange",label:"Laranja",hex:"#f97316"},{id:"green",label:"Verde",hex:"#22c55e"},{id:"lightgreen",label:"Verde claro",hex:"#86efac"},{id:"navy",label:"Azul marinho",hex:"#1e3a8a"},{id:"lightblue",label:"Azul claro",hex:"#38bdf8"},{id:"purple",label:"Roxo",hex:"#a855f7"},{id:"red",label:"Vermelho",hex:"#ef4444"},{id:"white",label:"Branco",hex:"#f5f5f5"},{id:"black",label:"Preto",hex:"#111111",tag:"metais"}],Iy=[{id:"11",label:"11h",sub:"sol alto",en:"The sun is high but not vertical, equivalent to about 11:00 AM: shadows are clearly directional and moderately short, angled across the ground, and sunlight entering through an opening lands as a compact, steeply-angled patch close to the opening."},{id:"12",label:"12h",sub:"sol a pino",en:"The sun is at its zenith, equivalent to about 12:00 noon: shadows are very short and fall almost directly beneath each object; sunlight entering an interior barely penetrates, landing as a small patch right at the foot of the opening; facades are lit flatly from above with strong light on horizontal surfaces."},{id:"14",label:"14h",sub:"sol caindo",en:"The sun is past its zenith, equivalent to about 2:00 PM: shadows are clearly elongated and angled consistently to one side; sunlight entering through an opening reaches noticeably into the room as a well-defined angled pool of light."},{id:"16",label:"16h",sub:"sol baixo \xB7 sombras longas",en:"The sun is low, equivalent to about 4:00 PM: shadows are long and strongly directional, raking across the ground and adjacent surfaces; light is warmer; sunlight entering through an opening reaches deep into the room as a long, low, clearly angled shaft landing on the floor and the lower part of the far wall."}],Qy=[{id:"light",label:"Leve",sub:"resqu\xEDcio",en:"LIGHT intensity: the weather has just eased off. Only its traces remain \u2014 ground still damp with a few shallow puddles or thin patches of leftover snow in sheltered corners, thin haze in the distance. Visibility is essentially clear and the sky is beginning to open."},{id:"moderate",label:"Moderado",sub:"po\xE7as \xB7 neve caindo",en:"MODERATE intensity: the weather is clearly happening but the scene stays fully reada
